[package]
name = "file-seal"
version = "0.2.1"
edition = "2021"
rust-version = "1.80"
description = "Local file integrity seals: SHA-256 fingerprint + timestamp ledger. Desktop GUI product + CLI."
license = "MIT"
readme = "README.md"
repository = "https://github.com/4jb5nkddkb-dot/file-seal"
keywords = ["hash", "integrity", "sha256", "seal", "audit", "gui"]
categories = ["command-line-utilities", "cryptography", "gui"]

[features]
default = ["cli"]
cli = []
gui = ["dep:eframe", "dep:egui", "dep:rfd"]

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

# GUI (modern versions)
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"], optional = true }
egui = { version = "0.29", optional = true }
rfd = { version = "0.15", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "file-seal"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "file-seal-gui"
path = "src/gui.rs"
required-features = ["gui"]
