[package]
name = "file-seal"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Local file integrity seals: SHA-256 fingerprint + timestamp ledger (no upload)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/4jb5nkddkb-dot/file-seal"
keywords = ["hash", "integrity", "sha256", "seal", "audit"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
clap = { version = "=4.4.18", features = ["derive", "env"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "file-seal"
path = "src/main.rs"
