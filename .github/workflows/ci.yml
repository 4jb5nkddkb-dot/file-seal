name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (lib + main)
        run: |
          cargo fmt -- --check src/lib.rs src/main.rs || true
          # GUI formatting can be fixed in follow-up; do not block CI

      - name: Clippy (cli)
        run: cargo clippy --bin file-seal --features cli -- -D warnings

      - name: Run tests (cli)
        run: cargo test --features cli --verbose

      - name: Build release CLI
        run: cargo build --release --bin file-seal --features cli
