name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to build and publish, for example v0.3.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libwayland-dev libxkbcommon-x11-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features --verbose

  build:
    name: Build ${{ matrix.platform }} binaries
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libwayland-dev libxkbcommon-x11-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release --bin file-seal --features cli

      - name: Build GUI
        run: cargo build --release --bin file-seal-gui --features gui

      - name: Package Linux binaries
        if: runner.os == 'Linux'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RUST_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          package_dir="package/file-seal-${RELEASE_TAG}-${RUST_TARGET}"
          mkdir -p "$package_dir" dist
          cp target/release/file-seal "$package_dir/"
          cp target/release/file-seal-gui "$package_dir/"
          cp README.md LICENSE "$package_dir/"
          archive="dist/file-seal-${RELEASE_TAG}-${RUST_TARGET}.tar.gz"
          tar -czf "$archive" -C package "file-seal-${RELEASE_TAG}-${RUST_TARGET}"
          (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          ls -lh dist

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RUST_TARGET: ${{ matrix.target }}
        shell: pwsh
        run: |
          $packageName = "file-seal-$env:RELEASE_TAG-$env:RUST_TARGET"
          $packageDir = "package\$packageName"
          New-Item -ItemType Directory -Force -Path $packageDir, dist | Out-Null
          Copy-Item target\release\file-seal.exe "$packageDir\"
          Copy-Item target\release\file-seal-gui.exe "$packageDir\"
          Copy-Item README.md, LICENSE "$packageDir\"
          $archive = "dist\$packageName.zip"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content "$archive.sha256"
          Get-ChildItem dist

      - name: Upload packaged binaries
        uses: actions/upload-artifact@v4
        with:
          name: file-seal-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Show release assets
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -print -exec sha256sum {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: File Seal ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
