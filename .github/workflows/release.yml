name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/release (e.g. v0.2.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build GUI (release)
        run: cargo build --release --bin file-seal-gui --features gui
        env:
          CARGO_TERM_COLOR: always

      - name: Build CLI (release)
        run: cargo build --release --bin file-seal --features cli

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/file-seal-gui.exe dist/file-seal-gui.exe
          Copy-Item target/release/file-seal.exe dist/file-seal.exe
          Get-ChildItem dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: file-seal-windows
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build GUI + CLI
        run: |
          cargo build --release --bin file-seal-gui --features gui
          cargo build --release --bin file-seal --features cli

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/release/file-seal-gui dist/
          cp target/release/file-seal dist/
          ls -la dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: file-seal-linux
          path: dist/*

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: File Seal ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## File Seal Desktop Product
            
            - **file-seal-gui.exe** (Windows) / **file-seal-gui** (Linux)：桌面应用，双击即用
            - **file-seal.exe** / **file-seal**：命令行版
            
            ### 使用
            1. 下载对应平台的 `file-seal-gui` 可执行文件
            2. 双击运行，出现仪表盘界面
            3. 在「封印文件」中添加图片/视频/任意文件
            4. 账本路径可在「设置」中自定义（独立保存）
            
            离线、本地优先、无上传。
          files: |
            artifacts/file-seal-windows/*
            artifacts/file-seal-linux/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
