name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/release (e.g. v0.2.1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release --bin file-seal --features cli

      - name: Build GUI
        continue-on-error: true
        run: cargo build --release --bin file-seal-gui --features gui
        env:
          CARGO_TERM_COLOR: always

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if (Test-Path target/release/file-seal.exe) { Copy-Item target/release/file-seal.exe dist/ }
          if (Test-Path target/release/file-seal-gui.exe) { Copy-Item target/release/file-seal-gui.exe dist/ }
          Get-ChildItem dist -ErrorAction SilentlyContinue

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: file-seal-windows
          path: dist/*
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps for egui
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libwayland-dev libxkbcommon-x11-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release --bin file-seal --features cli

      - name: Build GUI
        continue-on-error: true
        run: cargo build --release --bin file-seal-gui --features gui

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          [ -f target/release/file-seal ] && cp target/release/file-seal dist/
          [ -f target/release/file-seal-gui ] && cp target/release/file-seal-gui dist/
          ls -la dist/ || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: file-seal-linux
          path: dist/*
          if-no-files-found: warn

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: File Seal ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## File Seal Desktop Product
            
            - **file-seal-gui.exe** (Windows)：桌面应用（如果构建成功）
            - **file-seal.exe** (Windows) / **file-seal** (Linux)：命令行版
            
            ### 使用
            1. 下载对应平台的可执行文件
            2. 双击运行 GUI 版出现仪表盘界面
            3. 在「封印文件」中添加图片/视频/任意文件
            4. 账本路径可在「设置」中自定义（独立保存）
            
            离线、本地优先、无上传。
          files: |
            artifacts/file-seal-windows/*
            artifacts/file-seal-linux/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
