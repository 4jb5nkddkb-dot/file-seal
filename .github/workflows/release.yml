name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/release (e.g. v0.2.1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI (release)
        run: cargo build --release --bin file-seal --features cli

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/file-seal.exe dist/file-seal.exe
          Get-ChildItem dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: file-seal-windows
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI (release)
        run: cargo build --release --bin file-seal --features cli

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/release/file-seal dist/
          ls -la dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: file-seal-linux
          path: dist/*

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: File Seal ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## File Seal
            
            - **file-seal.exe** (Windows) / **file-seal** (Linux)：命令行版
            
            GUI 桌面版目前建议本地编译：
            ```bash
            cargo build --release --bin file-seal-gui --features gui
            ```
            
            ### 使用（CLI）
            ```bash
            file-seal seal ./file.pdf
            file-seal verify ./file.pdf
            file-seal list
            ```
            
            离线、本地优先、无上传。
          files: |
            artifacts/file-seal-windows/*
            artifacts/file-seal-linux/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
